name: Mutation tests

on:
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - Makefile
      - .gremlins.yaml
      - .github/workflows/mutations.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "1"
  GOTOOLCHAIN: local

jobs:
  mutations:
    name: Mutation report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Generate mutation report
        env:
          MUTATE_PATH: .
          MUTATE_DIFF: ${{ github.event.pull_request.base.sha }}
        run: make mutate

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: mutation-report.json
          if-no-files-found: warn
          retention-days: 14
